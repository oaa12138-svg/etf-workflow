name: Daily ETF workflow update

on:
  schedule:
    # GitHub Actions cron is UTC. 10:00 UTC = 18:00 Asia/Shanghai.
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-etf-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout page repository
        uses: actions/checkout@v4

      - name: Checkout code repository
        uses: actions/checkout@v4
        with:
          repository: oaa12138-svg/etf-quant-code
          path: code

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r code/requirements.txt

      - name: Run daily pipeline
        run: python code/outputs/run_daily_update.py --skip-github

      - name: Copy generated page
        run: cp code/outputs/recommendation_workflow.html index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily ETF workflow update $(date -u +%Y-%m-%d)"
            git push
          fi
